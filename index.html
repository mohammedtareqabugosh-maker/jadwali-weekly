<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدولي الأسبوعي</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ec; color: #2b2620; font-family: Tajawal, system-ui, sans-serif; }
  main { width: min(92vw, 460px); padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #6b6255; line-height: 1.7; }
  a.card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid #e3dccf; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  a.card strong { display: block; font-size: 1.15rem; margin-bottom: 4px; color: #b8862b; }
  a.card span { color: #6b6255; font-size: .95rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1915; color: #efe9dd; }
    a.card { background: #25221c; border-color: #3a352b; }
    p, a.card span { color: #a89f8f; }
  }
</style>
</head>
<body>
<main>
  <h1>جدولي الأسبوعي</h1>
  <p>اختر النسخة. كل نسخة مستقلة، ولها بياناتها المحلية الخاصة.</p>
  <a class="card" href="./ready/"><strong>النسخة الجاهزة</strong><span>الجدول معبّأ بالجدول الأسبوعي الخاص بصاحب المشروع.</span></a>
  <a class="card" href="./blank/"><strong>النسخة الفارغة</strong><span>جدول فارغ تُضيف إليه مهامك وجدولك الخاص.</span></a>
</main>
</body>
</html>
